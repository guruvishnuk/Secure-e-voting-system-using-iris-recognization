{% load static %}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>{% block title %}Enterprise Election Operations — Admin Portal{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            display: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['Fira Code', 'JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- DataTables & Toastr CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #070a12;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-elevated {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    
    /* DataTables Custom Enterprise Styling */
    .dataTables_wrapper {
      color: #94a3b8 !important;
      font-size: 0.8125rem;
      padding-top: 0.5rem;
    }
    .dataTables_length select, .dataTables_filter input {
      background-color: rgba(15, 23, 42, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: #f8fafc !important;
      border-radius: 0.75rem !important;
      padding: 0.4rem 0.8rem !important;
      font-size: 0.8125rem !important;
    }
    table.dataTable {
      border-color: rgba(255, 255, 255, 0.06) !important;
      margin-top: 1rem !important;
      margin-bottom: 1rem !important;
    }
    table.dataTable thead th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #cbd5e1 !important;
      background-color: rgba(15, 23, 42, 0.95) !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      font-size: 0.75rem !important;
      padding: 12px 16px !important;
    }
    table.dataTable tbody tr {
      background-color: rgba(15, 23, 42, 0.4) !important;
      color: #e2e8f0 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
    }
    table.dataTable tbody tr:hover {
      background-color: rgba(30, 41, 59, 0.6) !important;
    }
    .dataTables_paginate .paginate_button {
      color: #94a3b8 !important;
      border-radius: 0.5rem !important;
    }
    .dataTables_paginate .paginate_button.current {
      background: #4f46e5 !important;
      color: #ffffff !important;
      border: none !important;
    }

    /* Modal Overrides */
    .modal-backdrop {
      background-color: rgba(7, 10, 18, 0.8) !important;
      backdrop-filter: blur(8px) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070a12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
