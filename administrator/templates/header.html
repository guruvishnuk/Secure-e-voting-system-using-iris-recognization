{% load static %}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure E-Voting Enterprise Portal{% endblock %}</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- DataTables & Toastr CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

  <style>
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
    }
    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
    }
    /* DataTables Custom Styling for Dark Theme */
    .dataTables_wrapper {
      color: #94a3b8 !important;
      font-size: 0.875rem;
    }
    .dataTables_length select, .dataTables_filter input {
      background-color: rgba(30, 41, 59, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #f8fafc !important;
      border-radius: 0.5rem !important;
      padding: 0.375rem 0.75rem !important;
    }
    table.dataTable {
      border-color: rgba(255, 255, 255, 0.08) !important;
    }
    table.dataTable thead th {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #cbd5e1 !important;
      background-color: rgba(15, 23, 42, 0.9) !important;
    }
    table.dataTable tbody tr {
      background-color: rgba(15, 23, 42, 0.4) !important;
      color: #e2e8f0 !important;
    }
    table.dataTable tbody tr:hover {
      background-color: rgba(30, 41, 59, 0.6) !important;
    }
    .dataTables_paginate .paginate_button {
      color: #94a3b8 !important;
      border-radius: 0.375rem !important;
    }
    .dataTables_paginate .paginate_button.current {
      background: #4f46e5 !important;
      color: #ffffff !important;
      border: none !important;
    }
  </style>
</head>
