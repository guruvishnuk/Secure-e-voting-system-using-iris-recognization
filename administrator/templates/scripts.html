{% load static %}
<!-- jQuery & Bootstrap 3 Compatibility JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

<!-- Chart.js for Dashboard Analytics Graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<!-- Toastr Notifications -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<script>
  toastr.options = {
    "closeButton": true,
    "progressBar": true,
    "positionClass": "toast-top-right",
    "showDuration": "300",
    "hideDuration": "1000",
    "timeOut": "4000"
  };

  $(function () {
    // DataTables Initialization
    $('#example1, .datatable').DataTable({
      "pageLength": 10,
      "responsive": true,
      "language": {
        "search": "_INPUT_",
        "searchPlaceholder": "Search records..."
      }
    });

    // Active Navigation Highlight
    var currentUrl = window.location.href;
    $('.nav-tab').each(function() {
      if (this.href === currentUrl) {
        $(this).addClass('bg-indigo-600/20 text-indigo-400 border border-indigo-500/30');
      }
    });
  });
</script>

{% if messages %}
  {% for message in messages %}
    <script>
      toastr.{{ message.tags }}('{{ message|escapejs }}', '{{ message.tags|title }}');
    </script>
  {% endfor %}
{% endif %}
